<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>System Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap');
        body { 
            font-family: 'JetBrains+Mono', monospace;
            background-color: #000;
            -webkit-user-select: none;
        }
        input {
            caret-color: #22c55e; 
            -webkit-user-select: text;
        }
        input:focus { outline: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-green-500 overflow-hidden">

    <div class="w-full max-w-xs p-6 flex flex-col items-center gap-10">
        <div class="w-full text-[16px] opacity-30 self-start font-mono">
            Enter Code
        </div>

        <input type="text" id="auth-key" 
               placeholder="_" 
               inputmode="text"
               class="w-full bg-transparent border-b border-green-900 p-2 text-center text-xl tracking-[0.2em] focus:border-green-400 transition-all placeholder:text-green-900">
        
        <button onclick="verify()" 
                class="w-full border border-green-500 py-3 text-[10px] tracking-widest active:bg-green-500 active:text-black transition-all">
            EXECUTE
        </button>

        <div id="result" class="hidden w-full mt-4 text-[9px] border border-green-800 p-4 bg-green-950/20">
            <p class="text-white mb-1">> ACCESS_GRANTED</p>
            <p class="opacity-80">암호 해독을 축하합니다.</p>
            <p class="opacity-80">이 화면을 캡처하여 보내주시면 선착순 3명에게 기프티콘을 드립니다.</p>
            <p class="opacity-80">재미를 위해 정답을 친구에게 알려주지 마세요!!</p>
        </div>
    </div>

    <script>
        function verify() {
            const val = document.getElementById('auth-key').value.trim();
            if (val === "Found The Truth") {
                document.getElementById('result').classList.remove('hidden');
                if (navigator.vibrate) navigator.vibrate(50);
            } else {
                alert("ACCESS_DENIED: INVALID_KEY");
            }
        }
    </script>
</body>
</html>
